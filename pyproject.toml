[project]
name = "agent-infos"
version = "0.1.0"
description = "Agent IA utilisant des serveurs MCP pour générer un résumé et une liste des articles les plus intéressants"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"

dependencies = [
    "langchain>=0.3.0",
    "langchain-core",  # Let langchain determine the version
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters",
    "mcp @ git+https://github.com/modelcontextprotocol/python-sdk.git",
    "langgraph>=0.5.0",
    "langchain-experimental>=0.3.0",
    "SQLAlchemy>=2.0.0",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
    "pymysql>=1.0.0",
    "cryptography>=44.0.0",
    "minio>=7.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.8.0",
    "pgvector>=0.2.0",
    "psycopg2-binary>=2.9.0",
    "docker>=7.0.0",
    "testcontainers>=4.0.0",
    "pytest>=7.0.0",
    "guardrails-ai>=0.6.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]  # Look for packages in the "src" directory

[tool.setuptools.package-data]
"eguichetia.assets.prompts" = ["*.md"]
"eguichetia.assets.fiches" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[project.scripts]
configure-guardrails = "eguichetia.guardrails.configure_guardrails:configure_guardrails"

